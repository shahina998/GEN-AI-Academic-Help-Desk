<!DOCTYPE html>
<html>
<head>
    <title>GenAI Academic Helpdesk</title>
    <style>
        /* ----------------
           Global Styles
        ---------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #eef2ff, #f8f4ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: #1e293b;
        }

        /* ----------------
           Main Container
        ---------------- */
        .container {
            width: 100%;
            max-width: 950px;
            height: 90vh;
            max-height: 850px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(38, 64, 175, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(15px);
        }

        /* ----------------
           Header
        ---------------- */
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a8a;
            text-align: center;
            padding-top: 30px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            margin-top: 6px;
        }

        /* ----------------
           Suggested Questions
        ---------------- */
        .suggestions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 25px 20px;
        }

        .suggestions button {
            background: #f8fafc;
            border: 1px solid #dbeafe;
            color: #334155;
            padding: 11px 18px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .suggestions button:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.2);
        }

        /* ----------------
           Chat Box
        ---------------- */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #fafaff;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Scrollbar */
        #chat-box::-webkit-scrollbar {
            width: 7px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* ----------------
           Chat Messages
        ---------------- */
        .bot-msg,
        .user-msg {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        /* Bot Message */
        .bot-msg {
            align-self: flex-start;
            background: white;
            color: #334155;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 5px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        /* User Message */
        .user-msg {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.10);
        }

        /* Time */
        .time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 6px;
            text-align: right;
        }

        /* ----------------
           Typing Animation
        ---------------- */
        .typing {
            align-self: flex-start;
            background: white;
            color: #64748b;
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            font-size: 14px;
            font-style: italic;
            border: 1px solid #e2e8f0;
            animation: pulse 1.2s infinite;
        }

        /* ----------------
           Input Area
        ---------------- */
        .input-area {
            display: flex;
            gap: 12px;
            padding: 20px;
            background: white;
        }

        .input-area input {
            flex: 1;
            padding: 15px 18px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
            color: #1e293b;
            transition: all 0.25s ease;
        }

        .input-area input:focus {
            border-color: #93c5fd;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .input-area button {
            padding: 0 28px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .input-area button:active {
            transform: scale(0.97);
        }

        /* ----------------
           Animations
        ---------------- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* ----------------
           Responsive Design
        ---------------- */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                height: 95vh;
                border-radius: 18px;
            }

            h1 {
                font-size: 22px;
                padding-top: 22px;
            }

            .subtitle {
                font-size: 13px;
            }

            .suggestions {
                gap: 8px;
                padding: 18px 12px;
            }

            .suggestions button {
                padding: 9px 12px;
                font-size: 12px;
            }

            #chat-box {
                padding: 15px;
            }

            .bot-msg,
            .user-msg {
                max-width: 88%;
                font-size: 14px;
            }

            .input-area {
                padding: 12px;
                gap: 8px;
            }

            .input-area input {
                padding: 13px;
                font-size: 14px;
            }

            .input-area button {
                padding: 0 18px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Heading -->
    <h1>🤖 GenAI Academic Helpdesk</h1>
    <p class="subtitle">
        Your intelligent campus assistant
    </p>

    <!-- Suggested Questions -->
    <div class="suggestions">
        <button onclick="setQuestion('What is library timing?')">
            📚 Library
        </button>
        <button onclick="setQuestion('What is placement eligibility?')">
            🎓 Placement
        </button>
        <button onclick="setQuestion('What are hostel rules?')">
            🏠 Hostel
        </button>
        <button onclick="setQuestion('When do exams start?')">
            📝 Exams
        </button>
    </div>

    <!-- Chat Box -->
    <div id="chat-box">
        <div class="bot-msg">
            👋 Hello! I am your GenAI Academic Assistant.
            Ask anything about:
            syllabus, placements, hostel, exams and more.
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <input 
            type="text" 
            id="question" 
            placeholder="Ask your question..."
        >
        <button onclick="ask()">
            Send
        </button>
    </div>
</div>

<script>
    // ------------------------
    // Suggested Questions
    // ------------------------
    function setQuestion(text){
        document.getElementById("question").value = text;
    }

    // ------------------------
    // Ask Function
    // ------------------------
    async function ask() {
        let q = document.getElementById("question").value;

        if(q.trim() === "") return;

        let box = document.getElementById("chat-box");

        // User Message
        box.innerHTML += `
            <div class="user-msg">
                ${q}
                <div class="time">
                    ${new Date().toLocaleTimeString()}
                </div>
            </div>
        `;

        // Typing Animation
        box.innerHTML += `
            <div class="typing" id="loading">
                AI is typing...
            </div>
        `;

        box.scrollTop = box.scrollHeight;

        // Fetch API
        let res = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: q
            })
        });

        let data = await res.json();

        // Remove Loading Animation
        document.getElementById("loading").remove();

        // AI Response
        box.innerHTML += `
            <div class="bot-msg">
                ${data.answer}
            </div>
        `;

        // Auto Scroll
        box.scrollTop = box.scrollHeight;

        // Clear Input
        document.getElementById("question").value = "";
    }

    // ------------------------
    // Enter Key Support
    // ------------------------
    document.getElementById("question")
    .addEventListener("keypress", function(event){
        if(event.key === "Enter"){
            ask();
        }
    });
</script>

</body>
</html>
